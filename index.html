<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#142b4a">
<title>Travel Mate｜旅遊記帳</title>

<style>
:root {
  --primary: #193b63;
  --primary-dark: #102944;
  --primary-light: #eaf1fa;
  --accent: #69d6b0;
  --accent-dark: #28a982;
  --bg: #f3f6fb;
  --card: #ffffff;
  --text: #23344d;
  --muted: #8190a5;
  --border: #e7edf4;
  --danger: #e96868;
  --radius: 20px;
  --shadow: 0 8px 30px rgba(29, 56, 88, .06);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Noto Sans TC", sans-serif;
  background: var(--bg);
  color: var(--text);
  padding-bottom: 40px;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 3px solid rgba(105, 214, 176, .5);
  outline-offset: 2px;
}

.app-header {
  background: linear-gradient(135deg, #193b63, #102944);
  color: white;
  padding: 27px 20px 66px;
  position: relative;
  overflow: hidden;
}

.app-header::before,
.app-header::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}

.app-header::before {
  width: 230px;
  height: 230px;
  right: -80px;
  top: -130px;
  background: rgba(255,255,255,.06);
}

.app-header::after {
  width: 160px;
  height: 160px;
  right: 45px;
  bottom: -115px;
  background: rgba(105,214,176,.12);
}

.header-inner {
  max-width: 760px;
  margin: auto;
  position: relative;
  z-index: 1;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand {
  font-size: 12px;
  letter-spacing: 2px;
  color: #b6cce4;
  font-weight: 700;
}

.header-badge {
  font-size: 11px;
  border: 1px solid rgba(255,255,255,.22);
  padding: 6px 10px;
  border-radius: 20px;
  color: #d8e8f6;
}

.app-header h1 {
  font-size: clamp(25px, 5vw, 34px);
  margin-top: 20px;
  letter-spacing: .5px;
}

.header-subtitle {
  margin-top: 8px;
  color: #c0d1e4;
  font-size: 13px;
}

.nav-wrap {
  max-width: 720px;
  margin: -27px auto 0;
  padding: 0 16px;
  position: relative;
  z-index: 5;
}

.nav-tabs {
  display: flex;
  padding: 6px;
  gap: 6px;
  background: white;
  border-radius: 17px;
  box-shadow: var(--shadow);
}

.tab-btn {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--muted);
  padding: 13px 8px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  transition: .2s ease;
}

.tab-btn.active {
  color: white;
  background: var(--primary);
  box-shadow: 0 4px 12px rgba(25,59,99,.18);
}

.container {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 20px 16px;
}

.tab-content {
  display: none;
  animation: fadeIn .22s ease;
}

.tab-content.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

.card {
  background: var(--card);
  border: 1px solid rgba(226,233,243,.7);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}

.card-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 17px;
  font-size: 15px;
  font-weight: 800;
}

.card-title .title-left {
  display: flex;
  align-items: center;
  gap: 9px;
}

.title-icon {
  width: 34px;
  height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--primary-light);
  border-radius: 11px;
  font-size: 17px;
  flex-shrink: 0;
}

.settings-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
}

.settings-label {
  font-size: 13px;
  font-weight: 800;
}

.settings-controls {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 12px;
  color: var(--muted);
}

.settings-controls input {
  width: 88px;
  min-width: 0;
  padding: 8px;
  background: #f7f9fc;
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text);
}

.settings-controls #exchangeRate {
  width: 78px;
}

.summary-card {
  background: linear-gradient(135deg, #193b63, #254f7d);
  color: white;
  padding: 23px 20px;
  border: none;
  position: relative;
  overflow: hidden;
}

.summary-card::after {
  content: "";
  position: absolute;
  width: 170px;
  height: 170px;
  right: -65px;
  top: -95px;
  border-radius: 50%;
  background: rgba(255,255,255,.05);
  pointer-events: none;
}

.summary-heading {
  font-size: 12px;
  color: #ccdaeb;
  margin-bottom: 7px;
}

.summary-main {
  font-size: clamp(28px, 6vw, 37px);
  font-weight: 800;
  letter-spacing: -.5px;
  overflow-wrap: anywhere;
}

.summary-currency {
  font-size: 12px;
  color: #d3e0ee;
  margin-top: 5px;
}

.summary-divider {
  height: 1px;
  background: rgba(255,255,255,.17);
  margin: 21px 0;
}

.summary-bottom {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.summary-item {
  min-width: 0;
}

.summary-item + .summary-item {
  border-left: 1px solid rgba(255,255,255,.2);
  padding-left: 18px;
}

.summary-item .label {
  font-size: 11px;
  color: #ccdaeb;
}

.summary-item .value {
  font-size: 19px;
  font-weight: 800;
  margin-top: 6px;
  overflow-wrap: anywhere;
}

.day-selector {
  display: flex;
  gap: 9px;
  overflow-x: auto;
  padding: 3px 1px 12px;
  margin-bottom: 10px;
  scrollbar-width: thin;
}

.day-btn {
  border: 1px solid var(--border);
  border-radius: 12px;
  background: white;
  color: var(--muted);
  padding: 10px 15px;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 700;
  transition: .2s ease;
}

.day-btn.active {
  background: var(--accent);
  color: #143e34;
  border-color: var(--accent);
}

.form-row {
  display: flex;
  gap: 12px;
}

.form-group {
  flex: 1;
  min-width: 0;
  margin-bottom: 14px;
}

.form-group label {
  display: block;
  margin-bottom: 7px;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
}

.form-control {
  width: 100%;
  min-width: 0;
  padding: 12px 13px;
  border: 1px solid var(--border);
  border-radius: 11px;
  color: var(--text);
  background: #f9fbfd;
  font-size: 14px;
  transition: border-color .2s, background .2s;
}

.form-control:focus {
  border-color: var(--accent-dark);
  background: white;
  outline: none;
}

.form-control::placeholder {
  color: #a7b2c1;
}

input[type="file"].form-control {
  padding: 9px;
  font-size: 11px;
}

textarea.form-control {
  resize: vertical;
  line-height: 1.7;
}

.btn-submit {
  width: 100%;
  border: none;
  background: var(--primary);
  color: white;
  padding: 13px 16px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 800;
  transition: transform .15s, filter .15s;
}

.btn-submit:hover {
  filter: brightness(1.08);
}

.btn-submit:active {
  transform: scale(.985);
}

.btn-secondary {
  background: var(--accent-dark);
  color: white;
}

.btn-accent {
  background: var(--accent);
  color: #163e33;
}

.btn-small {
  width: auto;
  white-space: nowrap;
  padding: 10px 14px;
}

.expense-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.expense-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 15px;
  background: white;
  border: 1px solid rgba(226,233,243,.7);
  border-radius: 16px;
  box-shadow: 0 4px 15px rgba(29,56,88,.035);
  transition: transform .2s;
}

.expense-item:hover {
  transform: translateY(-2px);
}

.item-thumb {
  width: 53px;
  height: 53px;
  flex-shrink: 0;
  border-radius: 12px;
  object-fit: cover;
  cursor: pointer;
}

.item-icon {
  width: 46px;
  height: 46px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 13px;
  background: var(--primary-light);
  font-size: 21px;
}

.item-info {
  flex: 1;
  min-width: 0;
}

.item-title {
  font-size: 14px;
  font-weight: 800;
  overflow-wrap: anywhere;
}

.item-meta {
  margin-top: 5px;
  color: var(--muted);
  font-size: 11px;
}

.item-amount {
  min-width: 0;
  text-align: right;
  overflow-wrap: anywhere;
}

.amount-foreign {
  font-size: 14px;
  font-weight: 800;
}

.amount-twd {
  margin-top: 5px;
  color: var(--muted);
  font-size: 11px;
}

.btn-delete {
  border: none;
  background: #fff0f0;
  color: var(--danger);
  width: 29px;
  height: 29px;
  flex-shrink: 0;
  border-radius: 9px;
  font-size: 19px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.empty-state {
  text-align: center;
  padding: 36px 15px;
  background: white;
  border-radius: 17px;
  border: 1px dashed #d7e0ec;
  color: var(--muted);
  font-size: 13px;
  line-height: 2;
}

.empty-icon {
  font-size: 34px;
  margin-bottom: 8px;
}

.backup-tools {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 9px;
  padding: 12px 0;
}

.backup-tools button {
  padding: 10px 13px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: white;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.member-input-row {
  display: flex;
  gap: 9px;
}

.member-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 15px;
}

.member-tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 11px;
  border: 1px solid #c6f0e2;
  border-radius: 11px;
  background: #e9faf4;
  color: #247c62;
  font-size: 12px;
  font-weight: 700;
}

.member-tag button {
  border: none;
  background: transparent;
  color: var(--danger);
  font-size: 17px;
  line-height: 1;
}

.import-card {
  background: #f0f7ff;
  border-color: #dceaff;
}

.import-card .title-icon {
  background: #dceaff;
}

.split-add-row {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
}

.split-add-row .name-input {
  flex: 1.5;
}

.split-add-row .price-input {
  flex: 1;
}

.split-item-row {
  padding: 15px 0;
  border-bottom: 1px solid var(--border);
}

.split-item-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}

.split-item-header {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
}

.split-item-header .name-control {
  flex: 1.5;
  font-weight: 700;
}

.split-item-header .price-control {
  flex: 1;
  text-align: right;
}

.member-check-group {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.member-check-btn {
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #f8fafc;
  color: var(--muted);
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 700;
}

.member-check-btn.selected {
  border-color: var(--accent);
  background: #dcf8ed;
  color: #247c62;
}

.split-result-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}

.split-result-row:last-child {
  border-bottom: none;
}

.split-result-row .person-name {
  font-weight: 700;
}

.split-result-row .person-total {
  text-align: right;
  font-weight: 800;
  overflow-wrap: anywhere;
}

.split-result-row .person-total small {
  display: block;
  margin-top: 4px;
  font-weight: 400;
  color: var(--muted);
}

.total-row {
  margin-top: 8px;
  padding-top: 16px;
  border-top: 2px solid var(--border);
  font-weight: 800;
}

.section-caption {
  margin-top: -8px;
  margin-bottom: 15px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(9,20,35,.88);
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.modal img {
  display: block;
  max-width: 100%;
  max-height: 85vh;
  border-radius: 14px;
}

.toast {
  position: fixed;
  z-index: 300;
  left: 50%;
  bottom: 25px;
  transform: translate(-50%, 15px);
  padding: 12px 18px;
  background: #183653;
  color: white;
  border-radius: 12px;
  font-size: 13px;
  box-shadow: var(--shadow);
  opacity: 0;
  pointer-events: none;
  transition: .25s;
  max-width: calc(100% - 32px);
  text-align: center;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@media (max-width: 480px) {
  .app-header {
    padding: 23px 17px 59px;
  }

  .app-header h1 {
    margin-top: 17px;
  }

  .container {
    padding: 17px 12px;
  }

  .card {
    padding: 16px;
    border-radius: 17px;
  }

  .form-row {
    gap: 9px;
  }

  .summary-card {
    padding: 20px 17px;
  }

  .summary-bottom {
    gap: 8px;
  }

  .summary-item + .summary-item {
    padding-left: 12px;
  }

  .summary-item .value {
    font-size: 16px;
  }

  .expense-item {
    gap: 9px;
    padding: 12px 10px;
  }

  .item-thumb {
    width: 43px;
    height: 43px;
  }

  .item-icon {
    width: 39px;
    height: 39px;
    font-size: 18px;
  }

  .amount-foreign {
    font-size: 12px;
  }

  .item-title {
    font-size: 13px;
  }

  .btn-delete {
    width: 26px;
    height: 26px;
  }

  .settings-card {
    align-items: flex-start;
  }

  .settings-controls {
    width: 100%;
  }

  .member-input-row {
    flex-wrap: wrap;
  }

  .member-input-row .form-control {
    flex: 1 1 150px;
  }

  .split-add-row {
    gap: 8px;
  }

  .split-add-row .form-control {
    padding: 11px 9px;
    font-size: 13px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<header class="app-header">
  <div class="header-inner">
    <div class="header-top">
      <div class="brand">TRAVEL MATE</div>
      <div class="header-badge">✈ 旅行中的每一筆</div>
    </div>
    <h1>出國記帳與分帳</h1>
    <p class="header-subtitle">記錄旅途花費，讓每一次旅行都更輕鬆。</p>
  </div>
</header>

<div class="nav-wrap">
  <nav class="nav-tabs" aria-label="主要功能">
    <button class="tab-btn active" data-tab="daily" onclick="switchTab('daily')">
      📖 每日記帳
    </button>
    <button class="tab-btn" data-tab="split" onclick="switchTab('split')">
      👥 多人分帳
    </button>
  </nav>
</div>

<main class="container">

  <!-- 匯率設定 -->
  <section class="card settings-card">
    <div class="settings-label">⚙️ 幣別與匯率</div>
    <div class="settings-controls">
      <span>幣別</span>
      <input
        type="text"
        id="currencySymbol"
        value="JPY"
        maxlength="8"
        aria-label="外幣幣別"
      >
      <span>1 單位 =</span>
      <input
        type="number"
        id="exchangeRate"
        value="0.21"
        min="0.000001"
        step="any"
        aria-label="匯率"
      >
      <span>TWD</span>
      <button
        class="btn-submit btn-small"
        style="padding:8px 12px"
        onclick="updateSettings()"
      >套用</button>
    </div>
  </section>

  <!-- 每日記帳 -->
  <section id="tab-daily" class="tab-content active">

    <div class="card summary-card">
      <div class="summary-heading" id="summaryHeading">本日消費總額</div>
      <div class="summary-main" id="dayTotalForeign">0</div>
      <div class="summary-currency" id="summaryCurrency">JPY</div>

      <div class="summary-divider"></div>

      <div class="summary-bottom">
        <div class="summary-item">
          <div class="label">折合新台幣</div>
          <div class="value" id="dayTotalTWD">NT$ 0</div>
        </div>
        <div class="summary-item">
          <div class="label">旅程累計支出</div>
          <div class="value" id="grandTotalTWD">NT$ 0</div>
        </div>
      </div>
    </div>

    <div class="day-selector" id="daySelector"></div>

    <section class="card">
      <div class="card-title">
        <div class="title-left">
          <span class="title-icon">✍️</span>
          新增一筆消費
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="inputDate">消費日期</label>
          <input type="date" id="inputDate" class="form-control">
        </div>
        <div class="form-group" style="flex:1.4">
          <label for="inputTitle">消費項目</label>
          <input
            type="text"
            id="inputTitle"
            class="form-control"
            maxlength="150"
            placeholder="例如：拉麵、藥妝"
          >
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="inputAmount">金額（外幣）</label>
          <input
            type="number"
            id="inputAmount"
            class="form-control"
            min="0.01"
            step="any"
            placeholder="輸入金額"
          >
        </div>
        <div class="form-group">
          <label for="inputPhoto">收據照片（選填）</label>
          <input
            type="file"
            id="inputPhoto"
            class="form-control"
            accept="image/*"
          >
        </div>
      </div>

      <button class="btn-submit" onclick="addExpense()">＋ 新增記帳</button>
    </section>

    <section>
      <div class="card-title" style="padding:4px 3px">
        <div class="title-left">
          <span class="title-icon">🧾</span>
          消費明細
        </div>
        <span id="expenseCount" style="font-size:11px;color:var(--muted)">
          0 筆紀錄
        </span>
      </div>

      <div class="expense-list" id="itemList"></div>
    </section>

    <div class="backup-tools">
      <button onclick="exportData()">📤 匯出備份</button>
      <button onclick="importData()">📥 匯入備份</button>
    </div>
  </section>

  <!-- 多人分帳 -->
  <section id="tab-split" class="tab-content">

    <section class="card">
      <div class="card-title">
        <div class="title-left">
          <span class="title-icon">👥</span>
          旅行成員
        </div>
        <span style="font-size:11px;color:var(--muted)" id="memberCount">
          3 位成員
        </span>
      </div>

      <p class="section-caption">新增一起旅行的夥伴，設定每筆消費由哪些人共同分攤。</p>

      <div class="member-input-row">
        <input
          type="text"
          id="newMemberInput"
          class="form-control"
          maxlength="50"
          placeholder="輸入成員名稱"
        >
        <button class="btn-submit btn-small" onclick="addMember()">＋ 新增成員</button>
      </div>

      <div class="member-tags" id="memberTagsList"></div>
    </section>

    <section class="card import-card">
      <div class="card-title">
        <div class="title-left">

<div class="modal" id="imageModal" role="dialog" aria-label="收據照片預覽">
  <img id="modalImg" src="" alt="收據照片預覽">
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* =========================
   資料與初始化
========================= */

function loadStoredJSON(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value === null ? fallback : JSON.parse(value);
  } catch (error) {
    console.warn("讀取資料失敗：", key, error);
    return fallback;
  }
}

let expenses = loadStoredJSON("travel_expenses", []);
let settings = loadStoredJSON("travel_settings", {
  currency: "JPY",
  rate: 0.21
});
let members = loadStoredJSON("split_members", ["我", "小明", "小華"]);
let splitItems = [];

let selectedDate = getLocalDate();
let toastTimer = null;

function getLocalDate() {
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, "0");
  const day = String(now.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function saveExpenses() {
  localStorage.setItem("travel_expenses", JSON.stringify(expenses));
}

function saveSettings() {
  localStorage.setItem("travel_settings", JSON.stringify(settings));
}

function saveMembers() {
  localStorage.setItem("split_members", JSON.stringify(members));
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function formatNumber(value, maximumFractionDigits = 2) {
  return Number(value || 0).toLocaleString("zh-TW", {
    maximumFractionDigits
  });
}

function formatTWD(value) {
  return "NT$ " + formatNumber(Math.round(value));
}

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
}

function validRate(value) {
  return Number.isFinite(value) && value > 0;
}

window.addEventListener("DOMContentLoaded", () => {
  document.getElementById("inputDate").value = selectedDate;
  document.getElementById("currencySymbol").value = settings.currency;
  document.getElementById("exchangeRate").value = settings.rate;

  document.getElementById("imageModal").addEventListener("click", closeModal);

  document.addEventListener("keydown", event => {
    if (event.key === "Escape") closeModal();
  });

  document.getElementById("newMemberInput").addEventListener("keydown", event => {
    if (event.key === "Enter") addMember();
  });

  document.getElementById("splitItemPrice").addEventListener("keydown", event => {
    if (event.key === "Enter") addSplitItem();
  });

  document.getElementById("inputAmount").addEventListener("keydown", event => {
    if (event.key === "Enter") addExpense();
  });

  renderDaily();
  renderMembers();
});

/* =========================
   分頁切換
========================= */

function switchTab(tabName) {
  document.querySelectorAll(".tab-btn").forEach(button => {
    const active = button.dataset.tab === tabName;
    button.classList.toggle("active", active);
    button.setAttribute("aria-selected", String(active));
  });

  document.querySelectorAll(".tab-content").forEach(section => {
    section.classList.toggle("active", section.id === "tab-" + tabName);
  });

  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* =========================
   幣別與匯率
========================= */

function updateSettings() {
  const currencyInput = document.getElementById("currencySymbol");
  const rateInput = document.getElementById("exchangeRate");

  const currency = currencyInput.value.trim().toUpperCase();
  const rate = Number(rateInput.value);

  if (!currency) {
    showToast("請輸入幣別，例如 JPY、USD 或 KRW");
    currencyInput.focus();
    return;
  }

  if (!validRate(rate)) {
    showToast("匯率必須大於 0");
    rateInput.focus();
    return;
  }

  settings = { currency, rate };
  saveSettings();
  renderDaily();
  calculateSplit();

  showToast("幣別與匯率已更新");
}

/* =========================
   圖片壓縮
========================= */

function compressImage(file) {
  return new Promise((resolve, reject) => {
    if (!file) {
      resolve(null);
      return;
    }

    if (!file.type.startsWith("image/")) {
      reject(new Error("請選擇圖片檔案"));
      return;
    }

    const reader = new FileReader();

    reader.onerror = () => reject(new Error("圖片讀取失敗"));

    reader.onload = event => {
      const img = new Image();

      img.onerror = () => reject(new Error("圖片格式無法讀取"));

      img.onload = () => {
        const maxW = 900;
        const maxH = 900;
        const scale = Math.min(1, maxW / img.width, maxH / img.height);

        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));

        const ctx = canvas.getContext("2d");

        if (!ctx) {
          reject(new Error("無法處理圖片"));
          return;
        }

        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.72));
      };

      img.src = event.target.result;
    };

    reader.readAsDataURL(file);
  });
}

/* =========================
   每日記帳
========================= */

async function addExpense() {
  const date = document.getElementById("inputDate").value;
  const title = document.getElementById("inputTitle").value.trim();
  const amount = Number(document.getElementById("inputAmount").value);
  const photoInput = document.getElementById("inputPhoto");
  const file = photoInput.files?.[0] || null;

  if (!date || !title || !Number.isFinite(amount) || amount <= 0) {
    showToast("請填寫日期、消費項目與有效金額");
    return;
  }

  if (file && file.size > 15 * 1024 * 1024) {
    showToast("照片不可超過 15 MB");
    return;
  }

  if (!validRate(Number(settings.rate))) {
    showToast("請先設定正確匯率");
    return;
  }

  try {
    const photo = await compressImage(file);

    expenses.push({
      id: Date.now() + Math.random(),
      date,
      title,
      amount,
      rate: Number(settings.rate),
      currency: settings.currency,
      photo
    });

    saveExpenses();

    document.getElementById("inputTitle").value = "";
    document.getElementById("inputAmount").value = "";
    photoInput.value = "";

    selectedDate = date;
    renderDaily();
    showToast("記帳成功！");
  } catch (error) {
    showToast(error.message || "照片處理失敗，請再試一次");
  }
}

function deleteExpense(id) {
  if (!confirm("確定要刪除這筆記帳嗎？")) return;

  expenses = expenses.filter(item => item.id !== id);
  saveExpenses();
  renderDaily();
  showToast("已刪除這筆記帳");
}

function renderDaily() {
  document.querySelectorAll(".curr-name").forEach(element => {
    element.textContent = settings.currency;
  });

  document.getElementById("summaryCurrency").textContent =
    settings.currency + " · 外幣";

  const dates = [...new Set(expenses.map(item => item.date))]
    .filter(Boolean)
    .sort();

  if (selectedDate !== "ALL" && !dates.includes(selectedDate)) {
    dates.push(selectedDate);
    dates.sort();
  }

  const selector = document.getElementById("daySelector");
  selector.innerHTML = "";

  const allButton = document.createElement("button");
  allButton.className = "day-btn" + (selectedDate === "ALL" ? " active" : "");
  allButton.textContent = "全部明細";
  allButton.onclick = () => {
    selectedDate = "ALL";
    renderDaily();
  };
  selector.appendChild(allButton);

  dates.forEach(date => {
    const button = document.createElement("button");
    button.className = "day-btn" + (selectedDate === date ? " active" : "");
    button.textContent = date.slice(5).replace("-", "/");
    button.onclick = () => {
      selectedDate = date;
      document.getElementById("inputDate").value = date;
      renderDaily();
    };
    selector.appendChild(button);
  });

  const filtered = selectedDate === "ALL"
    ? expenses
    : expenses.filter(item => item.date === selectedDate);

  const foreignTotal = filtered.reduce(
    (sum, item) => sum + Number(item.amount || 0), 0
  );

  const twdTotal = filtered.reduce(
    (sum, item) => sum + Math.round(
      Number(item.amount || 0) * Number(item.rate || settings.rate)
    ), 0
  );

  const grandTotal = expenses.reduce(
    (sum, item) => sum + Math.round(
      Number(item.amount || 0) * Number(item.rate || settings.rate)
    ), 0
  );

  document.getElementById("summaryHeading").textContent =
    selectedDate === "ALL"
      ? "全部消費總額"
      : selectedDate === getLocalDate()
        ? "今日消費總額"
        : selectedDate + " 消費總額";

  document.getElementById("dayTotalForeign").textContent =
    formatNumber(foreignTotal);

  document.getElementById("dayTotalTWD").textContent =
    formatTWD(twdTotal);

  document.getElementById("grandTotalTWD").textContent =
    formatTWD(grandTotal);

  document.getElementById("expenseCount").textContent =
    filtered.length + " 筆紀錄";

  const list = document.getElementById("itemList");
  list.innerHTML = "";

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🧳</div>
        <div>還沒有消費紀錄</div>
        <div>新增第一筆，開始記錄旅途花費吧！</div>
      </div>
    `;
    return;
  }

  [...filtered].reverse().forEach(item => {
    const twdValue = Math.round(
      Number(item.amount) * Number(item.rate || settings.rate)
    );

    const element = document.createElement("article");
    element.className = "expense-item";

    const photoHTML = item.photo
      ? `<img src="${item.photo}" class="item-thumb" alt="消費照片" loading="lazy">`
      : `<div class="item-icon">🧾</div>`;

    element.innerHTML = `
      ${photoHTML}
      <div class="item-info">
        <div class="item-title">${escapeHtml(item.title)}</div>
        <div class="item-meta">${escapeHtml(item.date)}</div>
      </div>
      <div class="item-amount">
        <div class="amount-foreign">
          ${formatNumber(item.amount)} ${escapeHtml(item.currency || settings.currency)}
        </div>
        <div class="amount-twd">≈ ${formatTWD(twdValue)}</div>
      </div>
      <button class="btn-delete" aria-label="刪除這筆記帳">×</button>
    `;

    const thumb = element.querySelector(".item-thumb");
    if (thumb) {
      thumb.addEventListener("click", () => showModal(item.photo));
    }

    element.querySelector(".btn-delete").addEventListener("click", () => {
      deleteExpense(item.id);
    });

    list.appendChild(element);
  });
}

/* =========================
   成員管理
========================= */

function renderMembers() {
  saveMembers();

  const container = document.getElementById("memberTagsList");
  container.innerHTML = "";

  document.getElementById("memberCount").textContent =
    members.length + " 位成員";

  members.forEach((member, index) => {
    const tag = document.createElement("div");
    tag.className = "member-tag";
    tag.innerHTML = `
      <span>${escapeHtml(member)}</span>
      <button aria-label="移除 ${escapeHtml(member)}">×</button>
    `;

    tag.querySelector("button").addEventListener("click", () => {
      removeMember(index);
    });

    container.appendChild(tag);
  });

  renderSplitItems();
}

function addMember() {
  const input = document.getElementById("newMemberInput");
  const name = input.value.trim();

  if (!name) {
    showToast("請輸入成員名稱");
    return;
  }

  if (members.includes(name)) {
    showToast("這位成員已經存在");
    return;
  }

  members.push(name);
  input.value = "";
  renderMembers();
  showToast("已新增成員：" + name);
}

function removeMember(index) {
  const name = members[index];

  if (!confirm(`確定要移除成員「${name}」嗎？`)) return;

  members.splice(index, 1);

  // 同時移除其分帳資格，避免殘留資料。
  splitItems.forEach(item => {
    item.assignedMembers = item.assignedMembers.filter(
      member => member !== name
    );
  });

  renderMembers();
  showToast("已移除成員");
}

/* =========================
   收據文字匯入
========================= */

function parseAndImportText() {
  const textarea = document.getElementById("pasteTextarea");
  const text = textarea.value.trim();

  if (!text) {
    showToast("請先貼上收據文字");
    return;
  }

  const lines = text.split(/\r?\n/);
  let importedCount = 0;
  const failedLines = [];

  lines.forEach((line, index) => {
    const cleanLine = line.trim();
    if (!cleanLine) return;

    /*
      支援：
      拉麵 1200
      拉麵：1200
      拉麵: 1,200
      拉麵 = 1200
      拉麵 / 1200
      1200 拉麵
    */

    const match = cleanLine.match(
      /^(.+?)\s*(?::|：|=|\/|\t|\s)\s*([0-9][0-9,]*(?:\.[0-9]+)?)\s*(?:元|円|日圓|日元)?$/i
    );

    const reverseMatch = cleanLine.match(
      /^([0-9][0-9,]*(?:\.[0-9]+)?)\s+(.+)$/
    );

    let name = "";
    let rawPrice = "";

    if (match) {
      name = match[1].trim();
      rawPrice = match[2];
    } else if (reverseMatch) {
      rawPrice = reverseMatch[1];
      name = reverseMatch[2].trim();
    }

    const price = Number(rawPrice.replace(/,/g, ""));

    if (name && Number.isFinite(price) && price > 0) {
      splitItems.push({
        id: Date.now() + Math.random(),
        name,
        price,
        assignedMembers: [...members]
      });

      importedCount++;
    } else {
      failedLines.push(index + 1);
    }
  });

  if (importedCount > 0) {
    textarea.value = "";
    renderSplitItems();

    if (failedLines.length > 0) {
      showToast(`成功匯入 ${importedCount} 筆，另有 ${failedLines.length} 行未辨識`);
    } else {
      showToast(`成功匯入 ${importedCount} 筆消費！`);
    }
  } else {
    showToast("沒有可匯入的項目，請檢查品名與金額格式");
  }
}

/* =========================
   分帳項目管理
========================= */

function addSplitItem() {
  const nameInput = document.getElementById("splitItemName");
  const priceInput = document.getElementById("splitItemPrice");

  const name = nameInput.value.trim() || "未命名消費";
  const price = Number(priceInput.value);

  if (!Number.isFinite(price) || price <= 0) {
    showToast("請輸入有效的消費金額");
    priceInput.focus();
    return;
  }

  splitItems.push({
    id: Date.now() + Math.random(),
    name,
    price,
    assignedMembers: [...members]
  });

  nameInput.value = "";
  priceInput.value = "";

  renderSplitItems();
  showToast("已加入分帳清單");
}

function updateSplitItemName(id, value) {
  const item = splitItems.find(entry => entry.id === id);
  if (item) item.name = value;
}

function updateSplitItemPrice(id, value) {
  const item = splitItems.find(entry => entry.id === id);
  if (!item) return;

  item.price = Number(value);

  if (!Number.isFinite(item.price) || item.price < 0) {
    item.price = 0;
  }

  calculateSplit();
}

function removeSplitItem(id) {
  splitItems = splitItems.filter(item => item.id !== id);
  renderSplitItems();
  showToast("已移除消費項目");
}

function toggleMemberAssign(itemId, memberName) {
  const item = splitItems.find(entry => entry.id === itemId);
  if (!item) return;

  if (item.assignedMembers.includes(memberName)) {
    item.assignedMembers = item.assignedMembers.filter(
      member => member !== memberName
    );
  } else {
    item.assignedMembers.push(memberName);
  }

  renderSplitItems();
}

function renderSplitItems() {
  const card = document.getElementById("splitItemsCard");
  const container = document.getElementById("splitItemsContainer");

  if (splitItems.length === 0) {
    card.style.display = "none";
    document.getElementById("splitResultCard").style.display = "none";
    return;
  }

  card.style.display = "block";
  container.innerHTML = "";

  splitItems.forEach(item => {
    const row = document.createElement("div");
    row.className = "split-item-row";

    row.innerHTML = `
      <div class="split-item-header">
        <input
          type="text"
          class="form-control name-control"
          value="${escapeHtml(item.name)}"
          aria-label="消費項目名稱"
          maxlength="150"
        >
        <input
          type="number"
          class="form-control price-control"
          value="${Number(item.price)}"
          min="0"
          step="any"
          aria-label="消費金額"
        >
        <button class="btn-delete" aria-label="刪除消費項目">×</button>
      </div>
      <div class="member-check-group"></div>
    `;

    row.querySelector(".name-control").addEventListener("change", event => {
      updateSplitItemName(item.id, event.target.value);
    });

    row.querySelector(".price-control").addEventListener("change", event => {
      updateSplitItemPrice(item.id, event.target.value);
    });

    row.querySelector(".btn-delete").addEventListener("click", () => {
      removeSplitItem(item.id);
    });

    const group = row.querySelector(".member-check-group");

    members.forEach(member => {
      const button = document.createElement("button");
      const selected = item.assignedMembers.includes(member);

      button.type = "button";
      button.className = "member-check-btn" + (selected ? " selected" : "");
      button.textContent = (selected ? "✓ " : "") + member;
      button.setAttribute("aria-pressed", String(selected));

      button.addEventListener("click", () => {
        toggleMemberAssign(item.id, member);
      });

      group.appendChild(button);
    });

    container.appendChild(row);
  });

  calculateSplit();
}

/* =========================
   分帳計算
========================= */

function calculateSplit() {
  const card = document.getElementById("splitResultCard");
  const container = document.getElementById("splitResultList");

  if (splitItems.length === 0) {
    card.style.display = "none";
    return;
  }

  card.style.display = "block";

  const totals = Object.fromEntries(members.map(member => [member, 0]));
  let grandTotal = 0;

  splitItems.forEach(item => {
    const price = Number(item.price);

    if (!Number.isFinite(price) || price < 0) return;

    grandTotal += price;

    const assigned = item.assignedMembers.filter(
      member => Object.prototype.hasOwnProperty.call(totals, member)
    );

    if (assigned.length === 0) return;

    const share = price / assigned.length;

    assigned.forEach(member => {
      totals[member] += share;
    });
  });

  container.innerHTML = "";

  members.forEach(member => {
    const amount = Math.round((totals[member] + Number.EPSILON) * 100) / 100;
    const twd = Math.round(amount * Number(settings.rate));

    const row = document.createElement("div");
    row.className = "split-result-row";

    row.innerHTML = `
      <span class="person-name">👤 ${escapeHtml(member)}</span>
      <span class="person-total">
        ${formatNumber(amount)} ${escapeHtml(settings.currency)}
        <small>約 ${formatTWD(twd)}</small>
      </span>
    `;

    container.appendChild(row);
  });

  const totalTwd = Math.round(grandTotal * Number(settings.rate));
  const unassignedCount = splitItems.filter(
    item => !item.assignedMembers.some(member => members.includes(member))
  ).length;

  const totalRow = document.createElement("div");
  totalRow.className = "split-result-row total-row";

  totalRow.innerHTML = `
    <span>總消費金額</span>
    <span class="person-total">
      ${formatNumber(grandTotal)} ${escapeHtml(settings.currency)}
      <small>約 ${formatTWD(totalTwd)}</small>
    </span>
  `;

  container.appendChild(totalRow);

  if (unassignedCount > 0) {
    const warning = document.createElement("div");
    warning.style.cssText =
      "margin-top:12px;padding:12px;border-radius:10px;background:#fff6e8;color:#99651c;font-size:12px;line-height:1.7";
    warning.textContent =
      `提醒：有 ${unassignedCount} 筆消費尚未選擇分攤成員，這些金額不會計入任何人的應付金額。`;

    container.appendChild(warning);
  }
}

/* =========================
   匯入分帳結果至記帳
========================= */

function importSplitToDaily() {
  if (splitItems.length === 0) {
    showToast("目前沒有分帳項目");
    return;
  }

  const today = getLocalDate();
  const totals = Object.fromEntries(members.map(member => [member, 0]));

  splitItems.forEach(item => {
    const price = Number(item.price);

    if (!Number.isFinite(price) || price <= 0) return;

    const assigned = item.assignedMembers.filter(
      member => Object.prototype.hasOwnProperty.call(totals, member)
    );

    if (assigned.length === 0) return;

    const share = price / assigned.length;

    assigned.forEach(member => {
      totals[member] += share;
    });
  });

  const records = members
    .filter(member => totals[member] > 0)
    .map(member => ({
      id: Date.now() + Math.random(),
      date: today,
      title: `[分帳] ${member} 的分攤費用`,
      amount: Math.round((totals[member] + Number.EPSILON) * 100) / 100,
      rate: Number(settings.rate),
      currency: settings.currency,
      photo: null
    }));

  if (records.length === 0) {
    showToast("沒有可匯入的分帳金額");
    return;
  }

  if (!confirm(
    `確定將 ${records.length} 位成員的分攤金額寫入每日記帳嗎？\n日期：${today}\n注意：每位成員的分攤金額會各自新增一筆紀錄。`
  )) {
    return;
  }

  expenses.push(...records);
  saveExpenses();

  selectedDate = today;
  document.getElementById("inputDate").value = today;

  renderDaily();
  switchTab("daily");

  showToast(`成功匯入 ${records.length} 位成員的分帳金額`);
}

/* =========================
   照片預覽
========================= */

function showModal(src) {
  if (!src) return;

  document.getElementById("modalImg").src = src;
  document.getElementById("imageModal").style.display = "flex";
}

function closeModal() {
  document.getElementById("imageModal").style.display = "none";
  document.getElementById("modalImg").src = "";
}

/* =========================
   資料備份與還原
========================= */

function exportData() {
  const data = {
    version: 2,
    exportedAt: new Date().toISOString(),
    expenses,
    settings,
    members
  };

  const blob = new Blob(
    [JSON.stringify(data, null, 2)],
    { type: "application/json;charset=utf-8" }
  );

  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");

  anchor.href = url;
  anchor.download = `travel_backup_${getLocalDate()}.json`;

  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);

  showToast("備份檔案已開始下載");
}

function importData() {
  const input = document.createElement("input");

  input.type = "file";
  input.accept = ".json,application/json";

  input.onchange = event => {
    const file = event.target.files?.[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onerror = () => showToast("檔案讀取失敗");

    reader.onload = () => {
      try {
        const imported = JSON.parse(reader.result);

        if (
          !imported ||
          !Array.isArray(imported.expenses) ||
          !imported.expenses.every(item =>
            item &&
            typeof item.date === "string" &&
            typeof item.title === "string" &&
            Number.isFinite(Number(item.amount)) &&
            Number(item.amount) >= 0
          )
        ) {
          throw new Error("備份檔案格式不正確");
        }

        if (!confirm(
          "匯入備份將取代目前的記帳資料、幣別設定及成員名單，是否繼續？\n建議先匯出目前資料作為備份。"
        )) {
          return;
        }

        expenses = imported.expenses;

        if (
          imported.settings &&
          typeof imported.settings.currency === "string" &&
          validRate(Number(imported.settings.rate))
        ) {
          settings = {
            currency: imported.settings.currency,
            rate: Number(imported.settings.rate)
          };
        }

        if (
          Array.isArray(imported.members) &&
          imported.members.every(member => typeof member === "string")
        ) {
          members = [...new Set(imported.members)];
        }

        saveExpenses();
        saveSettings();
        saveMembers();

        document.getElementById("currencySymbol").value = settings.currency;
        document.getElementById("exchangeRate").value = settings.rate;

        renderDaily();
        renderMembers();

        showToast("資料匯入成功！");
      } catch (error) {
        showToast(error.message || "匯入失敗，請確認備份檔案");
      }
    };

    reader.readAsText(file);
  };

  input.click();
}
</script>
